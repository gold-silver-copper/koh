name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (all targets)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: clippy (production)
        run: cargo clippy --lib --bins --locked -- -D warnings
      - name: mawk and busybox, for the script in `koh help-agents` (dash is there)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mawk busybox
      - name: test
        run: cargo test --locked -- --test-threads 4
      - name: the script in `koh help-agents`, saying which shells and awks ran it
        if: runner.os == 'Linux'
        run: cargo test --locked --test e2e the_recipes_of_help_agents -- --nocapture

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
