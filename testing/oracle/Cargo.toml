# The oracle and its sides: koh at the working tree beside koh at a commit, compared on what the
# user's terminal would show. Its own workspace, so it never builds with koh's tests, and koh's
# lockfile and dependencies stay as they are. See README.md.
[workspace]
members = ["side", "driver"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false
license = "MIT"

[profile.release]
overflow-checks = true

# The same lints as koh: the harness is held to what it checks.
[workspace.lints.rust]
# A bare `unsafe` block must justify itself; this codebase is 100% safe.
unsafe_code = "forbid"
# Dead code is a hard error; every test helper must be used too.
dead_code = "deny"
# Results that must be used, and recursion that cannot terminate.
unused_must_use = "forbid"
unconditional_recursion = "forbid"

[workspace.lints.clippy]
# Lint-group toggles (priority = -1 so individual lints below can override).
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
suspicious = { level = "forbid", priority = -1 }

# --- the panic-free set: explicit panics, lossy casts, unchecked arithmetic, silent failures ---
# Tests may still unwrap, expect, panic and index (the keys in `clippy.toml`).
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
get_unwrap = "forbid"
unwrap_in_result = "forbid"
panic_in_result_fn = "forbid"
exit = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
expect_fun_call = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
large_stack_arrays = "forbid"
read_zero_byte_vec = "forbid"
debug_assert_with_mut_call = "forbid"
significant_drop_in_scrutinee = "forbid"
cast_lossless = "forbid"
unchecked_time_subtraction = "forbid"
unused_result_ok = "forbid"
mem_forget = "forbid"
integer_division = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_sign_loss = "forbid"
cast_possible_wrap = "forbid"
arithmetic_side_effects = "forbid"

# --- further correctness restrictions (deny) ---
lossy_float_literal = "deny"
float_cmp_const = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
# `.map_err(|_| ...)` silently drops the source error. Where hiding it is deliberate (secret or
# attacker-controlled input), say so with a local `#[expect]`.
map_err_ignore = "deny"
# Suppress with `#[expect]`, never `#[allow]`: an expectation that stops firing is itself a
# warning, so stale suppressions get cleaned up instead of silently accumulating.
allow_attributes = "deny"

# --- pedantic / nursery lints that are noisy or fight this codebase's deliberate style ---
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
# `_ = future => {}` is the conventional tokio::select! arm; `() = ...` is noisier, not clearer.
ignored_unit_patterns = "allow"
# nursery lints with known false positives / churn
cognitive_complexity = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"   # false-positives on single-statement lock guards
duration_suboptimal_units = "allow"     # `from_secs(3600)` is clearer than a contrived larger unit
# `const fn` on every getter is high-churn for debatable benefit; not enforced.
missing_const_for_fn = "allow"
