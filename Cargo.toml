[package]
name = "koh"
version = "0.18.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Stephen Korzen <stephen.korzen@gmail.com>"]
repository = "https://github.com/gold-silver-copper/koh"
description = "Ultra-minimal peer-to-peer remote shell, jobs, delta sync, and fux sessions over iroh QUIC"
readme = "README.md"
keywords = ["mosh", "shell", "terminal", "iroh", "fux"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src/**", "/README.md", "/COPYING", "/SECURITY.md", "/docs/THREAT_MODEL.md"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
fux = "0.42.0"
fux-vt = "0.19.0"
fuxix = "0.11.0"
iroh = "=1.3.0"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
qrcode = { version = "=0.14.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }

[profile.release]
opt-level = 2
lto = "thin"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
