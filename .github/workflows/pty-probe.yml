# TEMPORARY, removed before the PR is ready: macOS's PTY-table growth race, on fresh runners,
# without and with the table grown first.
name: pty probe (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  boundary:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test pty_race_probe --no-run
      - name: race at the table's boundaries
        run: |
          sysctl kern.tty.ptmx_max
          echo "in use: $(ls /dev | grep -c '^ttys')"
          date -u +%H:%M:%S
          cargo test --locked --test pty_race_probe pty_table_boundary_race -- --ignored --nocapture 2>&1 | grep -E "held"
          echo "in use: $(ls /dev | grep -c '^ttys')"
      - name: kernel log
        if: always()
        run: |
          sudo log show --last 20m --info --debug --predicate 'sender == "kernel" AND (eventMessage CONTAINS "pty" OR eventMessage CONTAINS "ptmx" OR eventMessage CONTAINS "max_retries")' | tail -20
