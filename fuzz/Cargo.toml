# Coverage-guided fuzzing of what koh decodes from a peer. Run a target with
# `cargo +nightly fuzz run <target>` (needs a nightly toolchain and `cargo install cargo-fuzz`).
# A package of its own: `cargo build` and `cargo test` in the parent never touch it, it is not in
# the published crate, and CI does not run it. Each target is one function of `entry.rs`, which
# `tests/mutation.rs` in the parent also runs, under a fixed seed, on every `cargo test`.
[package]
name = "koh-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
koh = { path = ".." }
libfuzzer-sys = "0.4"
# koh's own versions: the wire's decoding as koh does it.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = "=1.0.229"

# Not part of any workspace above it.
[workspace]

[[bin]]
name = "to_server"
path = "fuzz_targets/to_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "to_client"
path = "fuzz_targets/to_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false
