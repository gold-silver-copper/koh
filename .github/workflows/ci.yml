name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly (Mon 06:00 UTC): re-run the advisory scan so a newly-disclosed CVE against the
    # deliberately `=`-pinned dependency tree surfaces even with no code change.
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only needs to read the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            testing/bench -> target
            testing/oracle -> target
            testing/android/evil-peer -> target
            fuzz -> target
      - name: Check standalone harnesses
        run: |
          for manifest in testing/bench/Cargo.toml testing/oracle/Cargo.toml testing/android/evil-peer/Cargo.toml fuzz/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all --check
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
      - name: Oracle smoke against the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$PR_BASE
          elif [ -n "$PUSH_BASE" ] && git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null; then
            base=$PUSH_BASE
          else
            base=$(git rev-parse HEAD^)
          fi
          testing/oracle.sh "$base" --cases 80 --seed 7 --no-recordings
      - name: Weekly oracle corpus and planted bugs
        if: github.event_name == 'schedule'
        run: |
          testing/oracle.sh HEAD^ --cases 2000 --seed 23
          testing/oracle.sh --plants

  # The same green gate enforced locally — format, lints (warnings are errors), the layering guard,
  # the full test suite, and broken-doc-link detection — on BOTH supported desktop OSes.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      # `--all-targets` builds the library under `cfg(test)`, where clippy.toml lets tests panic.
      # Check the shipped library and binary as they are built for release, too.
      - name: clippy (production build)
        run: cargo clippy --lib --bins --locked -- -D warnings
      - name: layering guard
        # Enforce the load-bearing dependency edges the architecture relies on. Greps
        # the `use crate::` import form only, so doc-comment rustdoc links can't false-positive.
        run: |
          if grep -rnE '^[[:space:]]*use crate::' src/predict.rs; then
            echo "::error::predict.rs must import nothing from crate:: — keep it a standalone library"
            exit 1
          fi
          # The wire protocol sits below both ends: it may use the screen types, never a client or server.
          if grep -rnE '^[[:space:]]*use crate::(server|client)' src/proto.rs; then
            echo "::error::proto.rs must not import from server/client — both ends build on it"
            exit 1
          fi
          echo "layering edges OK"
      - name: test
        run: cargo test --locked
      - name: docs (deny broken intra-doc links)
        # Catches renamed intra-doc links before they ship a broken docs.rs build.
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

  # koh stays publishable, so `cargo install koh` keeps working.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  # Verify the declared MSRV (`rust-version = "1.95"`) actually builds — otherwise the declaration is
  # a false promise to `cargo install` users on an older toolchain. Check, not test (the `=`-pinned
  # lockfile makes it cheap and deterministic). Bump `rust-version` if this ever fails.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared MSRV
        run: cargo check --locked --all-targets

  # Supply-chain tripwire: the `=` pins buy reproducibility, so this is what keeps them from
  # silently aging into a CVE. Advisory ignores (and the rationale) live in deny.toml.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Coverage-guided fuzzing of the untrusted-input decode surfaces (the OpenSSH/OSS-Fuzz doctrine:
  # one harness per attacker-reachable parser). Builds the harnesses, then a short smoke run of each
  # that MUST stay crash-free.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: build fuzz targets
        # The committed lockfile, checked first: `cargo fuzz build` would update it silently.
        run: |
          cargo +nightly check --locked --manifest-path fuzz/Cargo.toml --bins
          cargo +nightly fuzz build
      - name: smoke (must stay crash-free)
        # Each starts from its own corpus and, for the ones that read program output, the
        # recorded output of real programs.
        run: |
          for target in screen_apply proto_decode history_apply client_input probe_replies; do
            cargo +nightly fuzz run "$target" -- -max_total_time=45 -rss_limit_mb=4096
          done
          for target in server_process server_input; do
            mkdir -p "fuzz/corpus/$target"
            cargo +nightly fuzz run "$target" "fuzz/corpus/$target" testing/corpus -- \
              -max_total_time=45 -rss_limit_mb=4096
          done
