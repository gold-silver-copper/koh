[package]
name = "koh-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/koh-core"
description = "The library behind koh, a peer-to-peer remote shell over iroh: protocol, sessions, prediction"
readme = "../README.md"
keywords = ["shell", "terminal", "iroh", "p2p"]
categories = ["network-programming"]
# The integration tests, and the `koh-launch` binary they start sessions through, are not needed
# to build or use the library.
exclude = ["tests/", "src/bin/"]

[dependencies]
# transport (pinned: iroh API churns; see README). iroh 1.0 brings its own QUIC backend (noq, a
# quinn fork); we never depend on quinn directly.
iroh = "=1.0.0"
# terminal / pty / tui. fux-vt is the server's emulator and supplies the cell type the client grid
# stores. 0.1.1 is the first release with what koh needs (opt-in events, extended replies, keypad
# state, cell constructors).
fux-vt = "0.1.1"
unicode-width = "0.2"
# The system calls koh makes beyond std, each safe to call: the server's PTYs and the session
# launcher (a new session with the PTY as its controlling terminal), the client's terminal (raw
# mode, the window size), `poll` on stdin, signals and `O_NOFOLLOW`. koh writes its own ANSI and
# reads raw stdin itself.
fuxix = "0.1.2"
# serialization. default-features = false drops postcard's `heapless-cas` default, whose
# `atomic-polyfill` transitive dep is unmaintained (RUSTSEC-2023-0089); we only need `use-std`
# (which pulls `alloc`) for `to_allocvec`/`from_bytes`.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "=1.0.228", features = ["derive"] }
# DEFLATE compression of screen frames (pure-Rust, no unsafe).
miniz_oxide = "0.8"
# async / runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# render the endpoint id as a terminal QR on `koh serve` (always printed); default-features = false drops the
# heavy image/svg/pic renderers (we only use the built-in unicode half-block renderer).
qrcode = { version = "=0.14.1", default-features = false }
# utility
anyhow = "1"
thiserror = "2"
tracing = "0.1"
# The log filter is `filter::Targets` (`target=level` directives), which needs no regex engine.
tracing-subscriber = "0.3"
# The OS's randomness, for new secret keys. Already in the tree through iroh.
getrandom = { version = "0.4", features = ["std"] }

[dev-dependencies]
# No `fork` (and so no `timeout`): no test runs a case in a subprocess.
proptest = { version = "1", default-features = false, features = ["std"] }
# The fault-injecting test transport (`tests/net/link.rs`): iroh's custom-transport API and the
# crates its trait signatures name. Dev-only, so release builds keep iroh's default features; all
# are already in the lockfile through iroh.
bytes = "1"
iroh = { version = "=1.0.0", features = ["unstable-custom-transports"] }
iroh-base = "=1.0.0"
n0-watcher = "=1.0.0"
noq-udp = { version = "=1.0.0", default-features = false }
# Deterministic deadline tests; no network endpoint or wall-clock wait.
tokio = { version = "1", features = ["test-util"] }

# ---------------------------------------------------------------------------
# Lints. The library is PANIC-FREE by construction: the panic-free set below is `forbid`, so no
# local `#[allow]` or `#[expect]` can lift it (E0453). No clap derive lives in this crate, so the
# forbid can sit here, crate-wide. The `koh` binary carries the same set at `deny`, because clap's
# derives `allow` some of these lints and a `forbid` would reject them.
# ---------------------------------------------------------------------------
[lints.rust]
# A bare `unsafe` block must justify itself; this codebase is 100% safe.
unsafe_code = "forbid"
# Dead code is a hard error; every test helper must be used too.
dead_code = "deny"
# Results that must be used, and recursion that cannot terminate.
unused_must_use = "forbid"
unconditional_recursion = "forbid"

[lints.clippy]
# Lint-group toggles (priority = -1 so individual lints below can override).
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
suspicious = { level = "forbid", priority = -1 }

# --- the panic-free set: explicit panics, lossy casts, unchecked arithmetic, silent failures ---
# Tests may still unwrap, expect, panic and index (the keys in `clippy.toml`).
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
get_unwrap = "forbid"
unwrap_in_result = "forbid"
panic_in_result_fn = "forbid"
exit = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
expect_fun_call = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
large_stack_arrays = "forbid"
read_zero_byte_vec = "forbid"
debug_assert_with_mut_call = "forbid"
significant_drop_in_scrutinee = "forbid"
cast_lossless = "forbid"
unchecked_time_subtraction = "forbid"
unused_result_ok = "forbid"
mem_forget = "forbid"
integer_division = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_sign_loss = "forbid"
cast_possible_wrap = "forbid"
arithmetic_side_effects = "forbid"

# --- further correctness restrictions (deny) ---
lossy_float_literal = "deny"
float_cmp_const = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
# `.map_err(|_| ...)` silently drops the source error. Where hiding it is deliberate (secret or
# attacker-controlled input), say so with a local `#[expect]`.
map_err_ignore = "deny"
# Suppress with `#[expect]`, never `#[allow]`: an expectation that stops firing is itself a
# warning, so stale suppressions get cleaned up instead of silently accumulating.
allow_attributes = "deny"

# --- pedantic / nursery lints that are noisy or fight this codebase's deliberate style ---
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
# `_ = future => {}` is the conventional tokio::select! arm; `() = ...` is noisier, not clearer.
ignored_unit_patterns = "allow"
# nursery lints with known false positives / churn
cognitive_complexity = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"   # false-positives on single-statement lock guards
duration_suboptimal_units = "allow"     # `from_secs(3600)` is clearer than a contrived larger unit
# `const fn` on every getter is high-churn for debatable benefit; not enforced.
missing_const_for_fn = "allow"
