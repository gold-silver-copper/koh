# Coverage-guided fuzzing of koh's untrusted-input decode paths (run with `cargo +nightly fuzz run
# <target>`; needs `cargo install cargo-fuzz`). Standalone package — NOT part of the koh package, so
# `cargo build`/`cargo test` in the parent never touch it, and it is excluded from the published
# .crate. One harness per attacker-reachable parser (the OpenSSH / OSS-Fuzz one-harness-per-parser
# doctrine): the shell stream's decoders, the server's emulator, filter and redraw
# and the client's display, the opening requests and answers, and the input decoders.
[package]
name = "koh-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
koh = { path = ".." }
libfuzzer-sys = "0.4"
# The user's terminal the client writes to, in `server_process`; koh's own version.
fux-vt = "0.10.0"

[[bin]]
name = "proto_decode"
path = "fuzz_targets/proto_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_process"
path = "fuzz_targets/server_process.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_input"
path = "fuzz_targets/client_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_input"
path = "fuzz_targets/server_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_decode"
path = "fuzz_targets/request_decode.rs"
test = false
doc = false
bench = false
