[package]
name = "koh"
version = "0.18.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Stephen Korzen <stephen.korzen@gmail.com>"]
repository = "https://github.com/gold-silver-copper/koh"
description = "Ultra-minimal peer-to-peer remote shell, jobs, and fux sessions over iroh QUIC"
readme = "README.md"
keywords = ["mosh", "shell", "terminal", "iroh", "fux"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src/**", "/README.md", "/COPYING", "/SECURITY.md", "/docs/THREAT_MODEL.md"]

[dependencies]
fux = "0.43.5"
# (fux's own reader of a colour: the same crate fux 0.43.5 has, and no other in the lockfile.)
fux-vt = "0.20.1"
fuxix = "0.12.0"
iroh = "=1.3.0"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
# The fault link (`tests/link/net.rs`): a network below QUIC, for the tests alone. It is iroh's
# custom-transport interface, and the three crates whose types that interface's traits name
# and iroh gives no name of its own for. All are in the lockfile through iroh already, and
# none is in a release build: a dev-dependency's features are not the package's.
iroh = { version = "=1.3.0", features = ["unstable-custom-transports"] }
iroh-base = "=1.3.0"
n0-watcher = "=1.0.0"
noq-udp = { version = "=1.3.0", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
