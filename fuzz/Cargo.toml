# Coverage-guided fuzzing of koh's untrusted-input decode paths (run with `cargo +nightly fuzz run
# <target>`; needs `cargo install cargo-fuzz`). Standalone package — NOT a member of koh's workspace, so
# `cargo build`/`cargo test` in the parent never touch it, and it is excluded from the published
# .crate. One harness per attacker-reachable parser (the OpenSSH / OSS-Fuzz one-harness-per-parser
# doctrine): server->client screen apply (the structured diff), the server emulator and the
# koh/3 message decoders.
[package]
name = "koh-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
koh-core = { path = "../koh-core" }
libfuzzer-sys = "0.4"
# Decodes fuzz input as a `ScreenDiff` exactly as koh's transport does; same pin as koh.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }

[[bin]]
name = "screen_apply"
path = "fuzz_targets/screen_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_decode"
path = "fuzz_targets/proto_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_process"
path = "fuzz_targets/server_process.rs"
test = false
doc = false
bench = false
