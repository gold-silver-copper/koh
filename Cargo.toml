[workspace]
members = ["koh-core"]
# Standalone packages with their own lockfiles, built only on demand.
exclude = ["fuzz", "testing/android/evil-peer"]

[workspace.package]
version = "0.12.1"
edition = "2021"
# The effective floor is dictated by dependencies, not by koh's own 2021 edition: fux-vt declares
# 1.95 (edition 2024), above the `=`-pinned iroh 1.0.0's 1.91. Declaring it turns "cargo install on
# an old toolchain" into a clear "requires rustc 1.95" instead of a confusing mid-compile error. Keep
# in sync with fux-vt and iroh on each bump.
rust-version = "1.95"
license = "MIT"
authors = ["Stephen Korzen <stephen.korzen@gmail.com>"]
repository = "https://github.com/gold-silver-copper/koh"
homepage = "https://github.com/gold-silver-copper/koh"

[package]
name = "koh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/koh"
description = "koh — a resilient peer-to-peer remote shell over iroh, with predictive local echo"
readme = "README.md"
keywords = ["mosh", "shell", "terminal", "iroh", "p2p"]
categories = ["command-line-utilities", "network-programming"]
# Keep the published .crate lean: the porting-research notes, the test infra, the integration tests,
# and the dev/CI tooling aren't needed to build or use koh. COPYING (the license) and CHANGELOG.md
# DO ship.
exclude = [
    "docs/",
    "testing/",
    "tests/",
    "fuzz/",
    # the library is its own crate
    "koh-core/",
    ".github/",
    "clippy.toml",
    "deny.toml",
    # the self-contained HTML slide deck (docs only, ~1.6 MB) — not needed to build or use koh.
    "koh-presentation.html",
]

[dependencies]
# Path and version: the published `koh` depends on the published `koh-core` of the same version.
koh-core = { path = "koh-core", version = "=0.12.1" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[dev-dependencies]
# The pty-binary e2e test drives the real binary on an allocated PTY.
portable-pty = "=0.9.0"

[profile.release]
opt-level = 3
lto = "thin"
# Keep release as strict as debug on integer overflow: koh is an interactive tool (not a throughput
# engine), so the per-op cost is negligible. Production code has no unchecked arithmetic
# (`koh-core` forbids `arithmetic_side_effects` and the lossy `as` casts, which overflow checks
# never see), so this is the second line of defence there, and the only one in tests: a
# wrap-on-overflow is a loud panic, not a silent miscompute. NOTE: panic stays `unwind`, never
# `abort` — a panicking connection task must unwind and detach cleanly, not abort the server.
overflow-checks = true

# ---------------------------------------------------------------------------
# Lints. The same set as `koh-core/Cargo.toml`, at `deny` instead of `forbid`: clap's derives emit
# `#[allow(...)]` for some of these lints, which a `forbid` rejects (E0453). CI's `-D warnings`
# still fails on any violation.
# ---------------------------------------------------------------------------
[lints.rust]
# A bare `unsafe` block must justify itself; this codebase is 100% safe.
unsafe_code = "forbid"
# Dead code is a hard error; every test helper must be used too.
dead_code = "deny"
# Results that must be used, and recursion that cannot terminate.
unused_must_use = "deny"
unconditional_recursion = "deny"

[lints.clippy]
# Lint-group toggles (priority = -1 so individual lints below can override).
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# --- the panic-free set: explicit panics, lossy casts, unchecked arithmetic, silent failures ---
# Tests may still unwrap, expect, panic and index (the keys in `clippy.toml`).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
exit = "deny"
indexing_slicing = "deny"
string_slice = "deny"
expect_fun_call = "deny"
infinite_loop = "deny"
large_stack_frames = "deny"
large_stack_arrays = "deny"
read_zero_byte_vec = "deny"
debug_assert_with_mut_call = "deny"
significant_drop_in_scrutinee = "deny"
cast_lossless = "deny"
unchecked_time_subtraction = "deny"
unused_result_ok = "deny"
mem_forget = "deny"
integer_division = "deny"
allow_attributes_without_reason = "deny"
wildcard_enum_match_arm = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
arithmetic_side_effects = "deny"

# --- further correctness restrictions (deny) ---
lossy_float_literal = "deny"
float_cmp_const = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
# `.map_err(|_| ...)` silently drops the source error. Where hiding it is deliberate (secret or
# attacker-controlled input), say so with a local `#[expect]`.
map_err_ignore = "deny"
# Suppress with `#[expect]`, never `#[allow]`: an expectation that stops firing is itself a
# warning, so stale suppressions get cleaned up instead of silently accumulating.
allow_attributes = "deny"

# --- pedantic / nursery lints that are noisy or fight this codebase's deliberate style ---
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
# `_ = future => {}` is the conventional tokio::select! arm; `() = ...` is noisier, not clearer.
ignored_unit_patterns = "allow"
# nursery lints with known false positives / churn
cognitive_complexity = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"   # false-positives on single-statement lock guards
duration_suboptimal_units = "allow"     # `from_secs(3600)` is clearer than a contrived larger unit
# `const fn` on every getter is high-churn for debatable benefit; not enforced.
missing_const_for_fn = "allow"
